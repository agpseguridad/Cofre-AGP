<style>
:root{--bg:#e9e8e6;--surf:#f8f7f5;--surf2:#ecebe8;--ink:#23252b;--mute:#6f7078;--line:#d6d3cf;--acc:#ee6a1c;--acc-ink:#fff;--blu:#3a46f0;--ok:#12a37a;--bad:#d6335a;
--serif:'Fraunces',Georgia,serif;--sans:'Schibsted Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151619;--surf:#1f2024;--surf2:#2a2b30;--ink:#eeedea;--mute:#9a9ba3;--line:#34353b;--acc:#ff8a3d;--acc-ink:#1a1206;--blu:#8f99ff;--ok:#3fd3a6;--bad:#ff6b8f}}
:root[data-theme="dark"]{--bg:#151619;--surf:#1f2024;--surf2:#2a2b30;--ink:#eeedea;--mute:#9a9ba3;--line:#34353b;--acc:#ff8a3d;--acc-ink:#1a1206;--blu:#8f99ff;--ok:#3fd3a6;--bad:#ff6b8f}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;z-index:1;padding:0 18px 120px}#wm{position:fixed;inset:-30%;z-index:0;pointer-events:none;transform:rotate(-30deg);display:flex;flex-direction:column;gap:38px;overflow:hidden;color:var(--ink);opacity:.065;font-family:'Unbounded',sans-serif;font-weight:500;font-size:20px;letter-spacing:.04em;white-space:nowrap}#wm div{display:flex;gap:56px}#wm div:nth-child(even){margin-left:-130px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.02em}
.top{padding:26px 2px 14px}
.top h1{font-size:44px;line-height:1.02;font-variation-settings:'opsz' 144}
.top h1 i{font-style:italic;color:var(--acc)}
.top p{margin:8px 0 0;color:var(--mute);max-width:30ch}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px}
.sbox{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:0 14px;height:52px}
.sbox input{flex:1;border:0;background:none;color:var(--ink);font:inherit;height:100%;outline:none}
.sbox svg{width:20px;height:20px;stroke:var(--mute);fill:none;stroke-width:2}
.chips{display:flex;gap:8px;margin-top:10px;align-items:center}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surf);font-size:14px;color:var(--mute);transition:.2s}
.chip[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.count{margin-left:auto;font-size:13px;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.card{text-align:left;border-radius:26px 26px 26px 8px;background:var(--surf);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;min-height:158px;transition:transform .15s}
.card:active{transform:scale(.97)}
.card:nth-child(4n+1),.card:nth-child(4n+4){grid-column:span 2;min-height:130px;flex-direction:row;align-items:center;border-radius:26px 8px 26px 26px}
.mono{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-family:var(--serif);font-size:24px;font-style:italic;color:#fff;flex:none}
.card h2{font-size:21px;line-height:1.1}
.meta{font-size:13px;color:var(--mute);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--surf2);color:var(--mute)}
.tag.hit{background:var(--blu);color:#fff}
.empty{grid-column:span 2;text-align:center;padding:48px 20px;color:var(--mute)}
.empty h2{font-size:26px;color:var(--ink);margin-bottom:6px}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(22px + env(safe-area-inset-bottom,0px));height:58px;padding:0 24px;border-radius:20px;background:var(--acc);color:var(--acc-ink);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 12px 30px -8px var(--acc);z-index:8}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mute);padding:20px 0 4px}
.dh{display:flex;gap:14px;align-items:center;padding:8px 0 18px}
.dh .mono{width:64px;height:64px;border-radius:22px;font-size:34px}
.dh h1{font-size:34px;line-height:1.05}
.acts{display:flex;gap:8px;margin-left:auto}
.ib{width:42px;height:42px;border-radius:14px;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.hbar{display:flex;gap:10px;margin:-6px 0 16px}.addapp{flex:1;height:52px;border-radius:16px;background:var(--acc);color:var(--acc-ink);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}.hbar .ib{width:52px;height:52px;border-radius:16px}.entry{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.entry h2{font-size:22px;font-style:italic;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surf2);margin-top:8px}
.row small{color:var(--mute);width:62px;flex:none;font-size:12px}
.row code{font-family:var(--mono);font-size:14px;flex:1;overflow-wrap:anywhere}
.row .ib{width:34px;height:34px;border-radius:11px;background:var(--surf)}
.row .ib svg{width:15px;height:15px}
.ea{display:flex;gap:16px;margin-top:12px;font-size:14px}
.ea button{color:var(--mute)}.ea .del{color:var(--bad)}
.scrim{position:fixed;inset:0;background:rgba(20,20,24,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .2s}
.sheet{background:var(--surf);width:100%;max-width:420px;max-height:88vh;overflow:auto;border-radius:30px;padding:24px 20px 22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet h2{font-size:28px;margin-bottom:14px}
.sheet label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
.sheet input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surf2);color:var(--ink);padding:0 14px;font:inherit}
.sheet input.pw{font-family:var(--mono)}
.pwr{display:flex;gap:8px}.pwr .ib{width:50px;height:50px;flex:none}
.btns{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;height:52px;border-radius:16px;font-weight:600;background:var(--surf2)}
.btn.p{background:var(--acc);color:var(--acc-ink)}.btn.d{background:var(--bad);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;z-index:30;animation:fade .2s}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
.sec{font-size:24px;margin:22px 0 10px}.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.th{aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center;color:var(--acc);cursor:pointer;padding:0}.th{position:relative}.th img{width:100%;height:100%;object-fit:cover;display:block}.th span{position:absolute;left:0;right:0;bottom:0;padding:18px 7px 6px;font-size:11px;line-height:1.2;font-weight:500;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.72))}.cap{display:flex;gap:10px;align-items:center;margin-top:12px}.cap img{width:64px;height:64px;object-fit:cover;border-radius:12px;flex:none}.cap input{flex:1;min-width:0}.sheet img.big{width:100%;border-radius:18px;max-height:60vh;object-fit:contain;background:var(--surf2)}.sheet input[type=file]{height:auto;padding:12px 14px}.sheet p{margin:0}.fl{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.fl .chip{white-space:nowrap;flex:none}.lk{display:grid;gap:12px;margin-top:8px}.lk input{height:54px;border-radius:16px;border:1px solid var(--line);background:var(--surf);color:var(--ink);padding:0 16px;font:inherit}.err{color:var(--bad);margin:0;min-height:1.4em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="wm" aria-hidden="true"></div><div id="app"></div>
<script>
const KEY='cofre.v1';
const HUES=['#ee6a1c','#3a46f0','#5b5d66','#d4570f','#2f3bd0','#74767f'];
const I={search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
plus:'<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" fill="none"><path d="M12 5v14M5 12h14"/></svg>',
copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
eye:'<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
bolt:'<svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>'};
let db={h:[]}, S={q:'',inInfo:false,view:'lock',id:null,shown:{},tag:'',fav:false};
const rawV=()=>{try{return JSON.parse(localStorage.getItem('cofre.v2'))}catch(e){return null}};
let K=null,SALT=null,sv=Promise.resolve();
function b64(u){u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,salt){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},K,new TextEncoder().encode(JSON.stringify(obj)));return{iv:b64(iv),ct:b64(ct)}}
async function dec(o,k=K){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},k,unb64(o.ct))))}
async function persist(){try{const e=await enc(db);localStorage.setItem('cofre.v2',JSON.stringify({s:b64(SALT),...e}))}catch(x){toast('No se pudo guardar')}}
function save(){if(K)sv=sv.then(persist)}
const uid=()=>Math.random().toString(36).slice(2,9);
let idb=null,imgs=[];
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('cofre-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('i',{keyPath:'id'});r.onsuccess=()=>{idb=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
const store=m=>idb.transaction('i',m).objectStore('i');
function allImgs(){return new Promise(res=>{if(!idb)return res([]);const q=store('readonly').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])})}
async function putImg(o){try{if(!idb||!K)return;const e=await enc({d:o.d,t:o.t||''});store('readwrite').put({id:o.id,hid:o.hid,iv:e.iv,ct:e.ct})}catch(e){}}
function delImg(id){try{if(idb)store('readwrite').delete(id)}catch(e){}}
function shrink(f){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const i=new Image();i.onerror=rej;i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};i.src=r.result};r.readAsDataURL(f)})}
async function addFiles(hid,files){const p=[];for(const f of files){if(!f.type.startsWith('image/'))continue;try{p.push({id:uid(),hid,d:await shrink(f),t:''})}catch(e){}}
if(!p.length){toast('No se pudo leer la imagen');return}
sheet(`<h2>${p.length>1?'Describí las imágenes':'Describí la imagen'}</h2><p style="color:var(--mute)">Opcional. Una referencia para distinguirla de otras parecidas.</p>${p.map((o,i)=>`<div class="cap"><img src="${o.d}" alt="Vista previa"><input data-cap="${i}" maxlength="80" placeholder="Ej. Frente del DNI de Mariana"></div>`).join('')}<div class="btns"><button class="btn" data-x>Cancelar</button><button class="btn p" data-ok>Guardar</button></div>`,s=>{p.forEach((o,i)=>{o.t=s.querySelector(`[data-cap="${i}"]`).value.trim();imgs.push(o);putImg(o)});toast(p.length==1?'Imagen guardada':p.length+' imágenes guardadas');render()})}
function ask(t,m,ok){sheet(`<h2>${t}</h2><p style="color:var(--mute)">${m}</p><div class="btns"><button class="btn" data-x>Cancelar</button><button class="btn d" data-ok>Eliminar</button></div>`,()=>{ok()})}
function viewImg(id){const m=imgs.find(x=>x.id===id);if(!m)return;sheet(`<img class="big" src="${m.d}" alt="${esc(m.t||'Imagen ampliada')}"><label>Descripción (referencia)</label><input name="t" maxlength="80" value="${esc(m.t)}" placeholder="Ej. Frente del DNI de Mariana"><div class="btns"><button class="btn d" data-rm>Eliminar</button><button class="btn" data-x>Cerrar</button><button class="btn p" data-ok>Guardar</button></div>`,s=>{m.t=v(s,'t');putImg(m);toast('Descripción guardada');render()});document.querySelector('[data-rm]').onclick=()=>ask('Eliminar imagen','Se quitará del titular. No se puede deshacer.',()=>{imgs=imgs.filter(x=>x.id!==id);delImg(id);document.querySelectorAll('.scrim').forEach(x=>x.remove());render()})}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const col=h=>HUES[[...h.id].reduce((a,c)=>a+c.charCodeAt(0),0)%HUES.length];
const ini=n=>(n.trim()[0]||'?').toUpperCase();
function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),1600)}
function filtered(){const q=norm(S.q.trim());const base=db.h.filter(h=>(!S.fav||h.fav)&&(!S.tag||(h.tags||[]).includes(S.tag)));if(!q)return sortF(base.map(h=>({h,hits:[]})));
 return sortF(base.map(h=>{const byName=norm(h.name).includes(q);const hits=S.inInfo?h.e.filter(e=>norm(e.app).includes(q)).map(e=>e.id):[];
  return (byName||hits.length)?{h,hits}:null}).filter(Boolean))}
const sortF=l=>l.sort((a,b)=>(b.h.fav?1:0)-(a.h.fav?1:0));
const allTags=()=>[...new Set(db.h.flatMap(h=>h.tags||[]))].sort();
function lockScr(){const su=!rawV();return `<header class="top"><h1>${su?'Creá tu<br><i>clave maestra.</i>':'Tu cofre<br><i>está cerrado.</i>'}</h1><p>${su?'Cifra todo lo que guardes. Si la olvidás, no hay forma de recuperar los datos.':'Escribí tu clave maestra para abrirlo.'}</p></header><div class="lk"><input id="mk" type="password" placeholder="Clave maestra" autocomplete="off">${su?'<input id="mk2" type="password" placeholder="Repetí la clave" autocomplete="off">':''}<button class="addapp" id="go" style="flex:none;width:100%">${su?'Crear cofre':'Desbloquear'}</button><p class="err" id="err" role="alert"></p></div>`}
async function auth(){await ready;const pw=document.getElementById('mk').value,er=document.getElementById('err'),su=!rawV();
 try{if(su){if(pw.length<8){er.textContent='Usá al menos 8 caracteres.';return}if(pw!==document.getElementById('mk2').value){er.textContent='Las claves no coinciden.';return}
  SALT=crypto.getRandomValues(new Uint8Array(16));K=await derive(pw,SALT);let lg=null;try{lg=JSON.parse(localStorage.getItem(KEY))}catch(x){}
  db=lg&&lg.h?lg:{h:[]};await persist();try{localStorage.removeItem(KEY)}catch(x){}
  imgs=(await allImgs()).filter(r=>r.d);imgs.forEach(r=>putImg(r))}
 else{const v=rawV();SALT=unb64(v.s);K=await derive(pw,SALT);db=await dec(v);imgs=[];
  for(const r of await allImgs()){try{if(r.ct)imgs.push({id:r.id,hid:r.hid,...await dec(r)});else if(r.d){imgs.push(r);putImg(r)}}catch(x){}}}
  S.view='home';render()}catch(x){K=null;er.textContent=su?'No se pudo crear el cofre.':'Clave incorrecta.'}}
function lock(){sv.then(()=>{K=null;SALT=null;db={h:[]};imgs=[];S={q:'',inInfo:false,view:'lock',id:null,shown:{},tag:'',fav:false};render()})}
async function exportBk(){
 try{const e=await enc({h:db.h,i:imgs});const out=JSON.stringify({app:'cofre',v:2,s:b64(SALT),...e});
 const x=document.createElement('a');x.href=URL.createObjectURL(new Blob([out],{type:'application/json'}));x.download='cofre-respaldo-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(x);x.click();x.remove();toast('Respaldo generado')}catch(x){toast('No se pudo generar el respaldo')}}
function importBk(){sheet(`<h2>Importar respaldo</h2><p style="color:var(--mute)">Se suma a lo que ya tenés. Lo repetido no se duplica.</p><label>Archivo de respaldo</label><input name="f" type="file" accept=".json,application/json"><label>Clave maestra del respaldo</label><input name="p" type="password" autocomplete="off"><div class="btns"><button class="btn" data-x>Cancelar</button><button class="btn p" data-ok>Importar</button></div>`,s=>{const f=s.querySelector('[name=f]').files[0],p=s.querySelector('[name=p]').value;if(!f||!p){toast('Elegí el archivo y escribí su clave');return false}doImport(f,p)})}
async function doImport(f,p){try{const o=JSON.parse(await f.text());if(o.app!=='cofre'||!o.ct)throw 0;const pl=await dec(o,await derive(p,unb64(o.s)));let a=0,b=0;
 for(const h of pl.h){if(!db.h.some(x=>x.id===h.id)){db.h.push(h);a++}}
 for(const m of pl.i||[]){if(!imgs.some(x=>x.id===m.id)){imgs.push(m);putImg(m);b++}}
 save();render();toast('Importado: '+a+' titulares, '+b+' imágenes')}catch(x){toast('Clave incorrecta o archivo inválido')}}
function home(){const res=filtered();
 return `<header class="top"><h1>Tus accesos,<br><i>bajo llave.</i></h1><p>Cada titular guarda sus usuarios y claves, ordenados por aplicación.</p><div class="fl" style="margin-top:14px"><button class="chip" id="lock">Bloquear</button><button class="chip" id="exp">Exportar respaldo</button><button class="chip" id="imp">Importar respaldo</button></div></header>
 <div class="search"><label class="sbox">${I.search}<input id="q" type="search" placeholder="Buscar por titular" value="${esc(S.q)}" autocomplete="off"></label>
 <div class="chips"><button class="chip" id="inInfo" aria-pressed="${S.inInfo}">Buscar también por aplicación</button><span class="count">${res.length} de ${db.h.length}</span></div>
 <div class="fl"><button class="chip" id="favF" aria-pressed="${S.fav}">★ Favoritos</button>${allTags().map(t=>`<button class="chip" data-tag="${esc(t)}" aria-pressed="${S.tag===t}">#${esc(t)}</button>`).join('')}</div></div>
 <div class="grid">${res.length?res.map(({h,hits})=>`<button class="card" data-open="${h.id}"><div class="mono" style="background:${col(h)}">${esc(ini(h.name))}</div>
 <div style="flex:1;min-width:0"><h2>${esc(h.name)}</h2><div class="meta">${h.fav?'★ ':''}${h.e.length} ${h.e.length==1?'acceso':'accesos'}${(h.tags||[]).length?' '+h.tags.map(t=>'#'+esc(t)).join(' '):''}</div>
 <div class="tags" style="margin-top:10px">${h.e.slice(0,4).map(e=>`<span class="tag ${hits.includes(e.id)?'hit':''}">${esc(e.app)}</span>`).join('')}</div></div></button>`).join(''):
 `<div class="empty"><h2>${db.h.length?'Sin coincidencias':'Aún no hay titulares'}</h2>${db.h.length?'Probá con otro nombre o activá “Buscar también por aplicación”.':'Agregá el primero con el botón de abajo.'}</div>`}</div>
 <button class="fab" id="addH">${I.plus}Nuevo titular</button>`}
function detail(){const h=db.h.find(x=>x.id===S.id);if(!h){S.view='home';return home()}
 return `<button class="back" id="back">‹ Titulares</button>
 <div class="dh"><div class="mono" style="background:${col(h)}">${esc(ini(h.name))}</div><div><h1>${esc(h.name)}</h1>${(h.tags||[]).length?`<div class="tags" style="margin-top:8px">${h.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>`:''}</div></div>
 <div class="hbar"><button class="addapp" id="addE">${I.plus}Incluir aplicación</button><button class="ib" id="favH" aria-label="Marcar como favorito" style="font-size:22px;color:var(--acc)">${h.fav?'★':'☆'}</button><button class="ib" id="editH" aria-label="Editar titular">${I.edit}</button></div>
 ${h.e.length?h.e.map(e=>`<article class="entry"><h2>${esc(e.app)}</h2>
 <div class="row"><small>Usuario</small><code>${esc(e.u)}</code><button class="ib" data-cp="${e.id}:u" aria-label="Copiar usuario">${I.copy}</button></div>
 <div class="row"><small>Clave</small><code>${S.shown[e.id]?esc(e.p):'•'.repeat(Math.min(e.p.length,14))}</code><button class="ib" data-eye="${e.id}" aria-label="Mostrar clave">${I.eye}</button><button class="ib" data-cp="${e.id}:p" aria-label="Copiar clave">${I.copy}</button></div>
 <div class="ea"><button data-ee="${e.id}">Editar</button><button class="del" data-de="${e.id}">Eliminar</button></div></article>`).join(''):
 `<div class="empty"><h2>Sin accesos</h2>Sumá usuario y clave de una aplicación.</div>`}
 <h2 class="sec">Imágenes</h2><div class="gal">${imgs.filter(m=>m.hid===h.id).map(m=>`<button class="th" data-img="${m.id}" aria-label="Ver imagen"><img src="${m.d}" alt="${esc(m.t||'Imagen de '+h.name)}">${m.t?`<span>${esc(m.t)}</span>`:''}</button>`).join('')}<label class="th" aria-label="Subir imagen">${I.plus}<input type="file" id="fileD" accept="image/*" multiple hidden></label></div>
 `}
function render(){const a=document.getElementById('app');const f=document.activeElement?.id==='q';
 a.innerHTML=S.view==='lock'?lockScr():S.view==='home'?home():detail();if(S.view==='lock')document.getElementById('mk')?.focus();
 if(f){const i=document.getElementById('q');i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
function sheet(html,onOk){const s=document.createElement('div');s.className='scrim';s.innerHTML=`<div class="sheet" role="dialog">${html}</div>`;
 document.body.append(s);const close=()=>s.remove();
 s.addEventListener('click',e=>{if(e.target===s||e.target.closest('[data-x]'))close()});
 s.querySelector('[data-ok]')?.addEventListener('click',()=>{if(onOk(s)!==false)close()});
 s.querySelector('input')?.focus();return s}
const v=(s,n)=>s.querySelector(`[name=${n}]`).value.trim();
function gen(){const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789!@#$%&*-_';const a=new Uint32Array(16);crypto.getRandomValues(a);return [...a].map(n=>c[n%c.length]).join('')}
function formH(h){sheet(`<h2>${h?'Editar titular':'Nuevo titular'}</h2><label>Nombre del titular</label><input name="n" value="${esc(h?.name)}" placeholder="Ej. Mariana Quiroga"><label>Etiquetas (opcional, separadas por coma)</label><input name="g" value="${esc((h?.tags||[]).join(', '))}" placeholder="Ej. Clientes, Familia"><label>Imágenes (opcional)</label><input name="f" type="file" accept="image/*" multiple>
 <div class="btns">${h?'<button class="btn d" data-del>Eliminar</button>':''}<button class="btn" data-x>Cancelar</button><button class="btn p" data-ok>Guardar</button></div>`,s=>{
 const n=v(s,'n');if(!n){toast('Escribí un nombre');return false}
 const fl=[...s.querySelector('[name=f]').files];const tg=[...new Set(v(s,'g').split(',').map(t=>t.trim().replace(/^#/,'')).filter(Boolean))].slice(0,6);let id;
 if(h){h.name=n;h.tags=tg;id=h.id}else{const x={id:uid(),name:n,e:[],tags:tg,fav:false};db.h.unshift(x);S.view='detail';S.id=x.id;id=x.id}
 save();render();if(fl.length)addFiles(id,fl)});
 if(h)document.querySelector('[data-del]').onclick=()=>ask('Eliminar titular','Se borrarán también sus accesos e imágenes. No se puede deshacer.',()=>{db.h=db.h.filter(x=>x!==h);imgs.filter(m=>m.hid===h.id).forEach(m=>delImg(m.id));imgs=imgs.filter(m=>m.hid!==h.id);S.view='home';save();document.querySelectorAll('.scrim').forEach(x=>x.remove());render()})}
function formE(h,e){sheet(`<h2>${e?'Editar aplicación':'Incluir aplicación'}</h2><label>Información (aplicación)</label><input name="a" value="${esc(e?.app)}" placeholder="Ej. Instagram">
 <label>Usuario</label><input name="u" value="${esc(e?.u)}" autocapitalize="none" autocomplete="off">
 <label>Clave</label><div class="pwr"><input name="p" class="pw" value="${esc(e?.p)}" autocomplete="off"><button class="ib" type="button" data-gen aria-label="Generar clave">${I.bolt}</button></div>
 <div class="btns"><button class="btn" data-x>Cancelar</button><button class="btn p" data-ok>Guardar</button></div>`,s=>{
 const a=v(s,'a'),u=v(s,'u'),p=v(s,'p');if(!a||!u||!p){toast('Completá los tres campos');return false}
 if(e)Object.assign(e,{app:a,u,p});else h.e.push({id:uid(),app:a,u,p});save();render()});
 document.querySelector('[data-gen]').onclick=()=>{document.querySelector('[name=p]').value=gen()}}
document.addEventListener('click',ev=>{const t=ev.target.closest('button');if(!t)return;
 if(t.id==='inInfo'){S.inInfo=!S.inInfo;render()}
 else if(t.id==='favF'){S.fav=!S.fav;render()}
 else if(t.dataset.tag){S.tag=S.tag===t.dataset.tag?'':t.dataset.tag;render()}
 else if(t.id==='favH'){const h=db.h.find(x=>x.id===S.id);h.fav=!h.fav;save();render()}
 else if(t.id==='lock'){lock()}
 else if(t.id==='go'){auth()}
 else if(t.id==='exp'){exportBk()}
 else if(t.id==='imp'){importBk()}
 else if(t.id==='addH')formH();
 else if(t.dataset.open){S.view='detail';S.id=t.dataset.open;scrollTo(0,0);render()}
 else if(t.id==='back'){S.view='home';S.shown={};render()}
 else if(t.id==='editH')formH(db.h.find(x=>x.id===S.id));
 else if(t.id==='addE')formE(db.h.find(x=>x.id===S.id));
 else if(t.dataset.eye){S.shown[t.dataset.eye]=!S.shown[t.dataset.eye];render()}
 else if(t.dataset.cp){const[id,k]=t.dataset.cp.split(':');const e=db.h.find(x=>x.id===S.id).e.find(x=>x.id===id);
  (navigator.clipboard?.writeText(e[k])||Promise.reject()).then(()=>toast(k==='u'?'Usuario copiado':'Clave copiada')).catch(()=>toast('No se pudo copiar'))}
 else if(t.dataset.ee){const h=db.h.find(x=>x.id===S.id);formE(h,h.e.find(x=>x.id===t.dataset.ee))}
 else if(t.dataset.de){const id=t.dataset.de;ask('Eliminar acceso','Se borrarán el usuario y la clave de esta aplicación.',()=>{const h=db.h.find(x=>x.id===S.id);h.e=h.e.filter(x=>x.id!==id);save();render()})}
 else if(t.dataset.img){viewImg(t.dataset.img)}});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){S.q=ev.target.value;render()}});
document.getElementById('wm').innerHTML=Array.from({length:30},()=>'<div>'+'<span>AGP Seguridad</span>'.repeat(10)+'</div>').join('');
document.addEventListener('change',ev=>{if(ev.target.id==='fileD'){addFiles(S.id,[...ev.target.files])}});
const ready=openDB();
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&(ev.target.id==='mk'||ev.target.id==='mk2'))auth()});
render();
</script>
</body>
</html>
